<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="version" content="<?= version ?>">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
<style>
  :root{
    --purple:#501e8c; --purple-dark:#3a1464; --purple-light:#f0ebf8;
    --blue:#0a6eaa; --blue-light:#e6f3fa; --bg:#f7f5fb; --ink:#241436;
    --muted:#6b5a80; --border:rgba(80,30,140,0.12); --radius:4px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Cairo",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;}
  .container{max-width:920px;margin:0 auto;padding:0 20px;width:100%;}

  /* official header band: SRU right, ICTD left */
  .band{background:#fff;border-bottom:1px solid var(--border);}
  .band .container{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:10px;padding-bottom:10px;}
  .band img{display:block;height:50px;width:auto;max-width:44vw;object-fit:contain;}
  .band .ictd{height:56px;}

  .topbar{background:var(--purple-dark);color:#fff;}
  .topbar .container{display:flex;align-items:center;gap:12px;padding-top:12px;padding-bottom:12px;}
  .topbar .title{font-weight:800;font-size:1.05rem;}
  .user{margin-inline-start:auto;font-size:.8rem;color:#e6dcf5;direction:ltr;}
  .diag{height:5px;background:var(--blue);}

  main{flex:1;padding:24px 0 48px;}
  .page-sub{color:var(--muted);font-size:13px;margin:-4px 0 20px;}

  .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px;box-shadow:0 1px 3px rgba(80,30,140,0.06);}
  .card h2{font-size:14px;color:var(--purple);margin:0 0 16px;padding-bottom:8px;border-bottom:1px solid var(--border);}

  .history-card{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;}
  .history-card .field{flex:1;min-width:240px;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1 / -1;}
  label{font-size:12.5px;font-weight:600;color:var(--ink);}
  label .req{color:var(--blue);font-weight:700;}
  input[type=text],input[type=date],input[type=time],select,textarea{
    font-family:inherit;font-size:13.5px;padding:9px 10px;border:1px solid var(--border);
    border-radius:var(--radius);background:#fff;color:var(--ink);outline:none;text-align:right;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--purple);box-shadow:0 0 0 2px var(--purple-light);}
  textarea{resize:vertical;min-height:80px;line-height:1.6;}

  .sev-row{display:flex;gap:10px;flex-wrap:wrap;}
  .sev-option{flex:1;min-width:100px;}
  .sev-option input{display:none;}
  .sev-option label{display:block;text-align:center;padding:9px 8px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);transition:all .12s;}
  .sev-option input:checked + label{background:var(--purple);border-color:var(--purple);color:#fff;}

  .actions{display:flex;justify-content:flex-start;gap:10px;margin-top:6px;flex-wrap:wrap;}
  button{font-family:inherit;font-size:14px;font-weight:600;padding:11px 22px;border-radius:var(--radius);cursor:pointer;border:1px solid var(--purple);}
  .btn-primary{background:var(--purple);color:#fff;}
  .btn-primary:hover{background:var(--purple-dark);}
  .btn-secondary{background:#fff;color:var(--purple);}
  .btn-secondary:hover{background:var(--purple-light);}
  .btn-accent{background:var(--blue);border-color:var(--blue);color:#fff;}
  .btn-accent:hover{background:#085a8a;}
  button:disabled{opacity:.6;cursor:not-allowed;}

  .status{font-size:12.5px;margin-top:10px;min-height:16px;}
  .status.ok{color:#166534;}
  .status.err{color:#b91c1c;}
  .status.info{color:var(--muted);}

  footer{background:var(--purple-dark);color:#e6dcf5;font-size:.8rem;margin-top:auto;}
  footer .container{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-top:14px;padding-bottom:14px;}
  footer .itoc{height:26px;width:auto;opacity:.95;}
  footer .ver{font-family:Arial,sans-serif;background:rgba(255,255,255,.12);padding:0 8px;border-radius:3px;}

  @media (max-width:600px){
    .grid{grid-template-columns:1fr;}
    .band img{height:34px;} .band .ictd{height:40px;}
    .user{display:none;}
  }
</style>
</head>
<body>

<div class="band"><div class="container">
  <img data-logo="sru" alt="جامعة سليمان الراجحي | Sulaiman Alrajhi University">
  <img class="ictd" data-logo="ictd" alt="الإدارة التنفيذية للاتصالات وتقنية المعلومات">
</div></div>
<header class="topbar"><div class="container">
  <span class="title"><?= appName ?></span>
  <span class="user" title="مسجّل الدخول بحساب الجامعة"><?= userEmail ?></span>
</div></header>
<div class="diag"></div>

<main><div class="container">
  <p class="page-sub">يرجى تعبئة النموذج أدناه، أو استدعاء تقرير سابق من القائمة، ثم الحفظ في النظام أو إنشاء نسخة Word.</p>

  <div class="card history-card">
    <div class="field">
      <label>استدعاء تقرير سابق</label>
      <select id="reportSelect">
        <option value="">— تقرير جديد —</option>
      </select>
    </div>
    <button type="button" class="btn-secondary" id="newReportBtn">تقرير جديد</button>
    <span class="status info" id="historyStatus" style="margin:0 6px;"></span>
  </div>

  <form id="incidentForm">

    <div class="card">
      <h2>بيانات الحادثة</h2>
      <div class="grid">
        <div class="field full">
          <label>عنوان الحادثة <span class="req">*</span></label>
          <input type="text" id="title" required placeholder="مثال: انقطاع الشبكة — مركز البيانات الرئيسي">
        </div>
        <div class="field">
          <label>رقم الحادثة المرجعي</label>
          <input type="text" id="incidentId" placeholder="يُنشأ تلقائيًا عند الحفظ" readonly>
        </div>
        <div class="field">
          <label>الإدارة / القسم <span class="req">*</span></label>
          <input type="text" id="department" required placeholder="مثال: ICTD — البنية التحتية">
        </div>
        <div class="field">
          <label>تاريخ الحادثة <span class="req">*</span></label>
          <input type="date" id="incidentDate" required>
        </div>
        <div class="field">
          <label>وقت الحادثة</label>
          <input type="time" id="incidentTime">
        </div>
        <div class="field">
          <label>الموقع / النظام المتأثر</label>
          <input type="text" id="location" placeholder="مثال: مبنى 3 غرفة الخوادم / نظام أوراكل فيوجن">
        </div>
        <div class="field">
          <label>تصنيف الحادثة</label>
          <select id="category">
            <option value="الشبكة">الشبكة</option>
            <option value="الخوادم / البنية التحتية">الخوادم / البنية التحتية</option>
            <option value="التطبيقات / الأنظمة">التطبيقات / الأنظمة</option>
            <option value="الأمن السيبراني">الأمن السيبراني</option>
            <option value="حوكمة البيانات / فقدان البيانات">حوكمة البيانات / فقدان البيانات</option>
            <option value="الأجهزة">الأجهزة</option>
            <option value="مزود خدمة / طرف ثالث">مزود خدمة / طرف ثالث</option>
            <option value="أخرى">أخرى</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>مستوى الخطورة</h2>
      <div class="sev-row" id="sevRow">
        <div class="sev-option"><input type="radio" name="severity" id="sev1" value="حرجة"><label for="sev1">حرجة</label></div>
        <div class="sev-option"><input type="radio" name="severity" id="sev2" value="عالية"><label for="sev2">عالية</label></div>
        <div class="sev-option"><input type="radio" name="severity" id="sev3" value="متوسطة" checked><label for="sev3">متوسطة</label></div>
        <div class="sev-option"><input type="radio" name="severity" id="sev4" value="منخفضة"><label for="sev4">منخفضة</label></div>
      </div>
    </div>

    <div class="card">
      <h2>بيانات مقدّم البلاغ</h2>
      <div class="grid">
        <div class="field">
          <label>مقدّم البلاغ <span class="req">*</span></label>
          <input type="text" id="reporterName" required placeholder="الاسم الكامل">
        </div>
        <div class="field">
          <label>المسمى الوظيفي</label>
          <input type="text" id="reporterTitle" placeholder="مثال: مدير عمليات تقنية المعلومات">
        </div>
        <div class="field">
          <label>وسيلة التواصل (بريد / هاتف)</label>
          <input type="text" id="reporterContact">
        </div>
        <div class="field">
          <label>تاريخ التقرير</label>
          <input type="date" id="reportDate">
        </div>
      </div>
    </div>

    <div class="card">
      <h2>تفاصيل الحادثة</h2>
      <div class="grid">
        <div class="field full">
          <label>وصف الحادثة <span class="req">*</span></label>
          <textarea id="description" required placeholder="ماذا حدث، كيف تم اكتشافه، التسلسل الزمني للأحداث..."></textarea>
        </div>
        <div class="field full">
          <label>الإجراءات الفورية المتخذة</label>
          <textarea id="actionsTaken" placeholder="الخطوات المتخذة لاحتواء الحادثة أو التخفيف من أثرها"></textarea>
        </div>
        <div class="field full">
          <label>السبب الجذري (إن وُجد)</label>
          <textarea id="rootCause" placeholder="السبب الأساسي إن تم تحديده"></textarea>
        </div>
        <div class="field full">
          <label>تقييم الأثر</label>
          <textarea id="impact" placeholder="الأنظمة والبيانات والمستخدمون أو الخدمات المتأثرة؛ مدة الانقطاع"></textarea>
        </div>
        <div class="field full">
          <label>التوصيات / الإجراءات التصحيحية</label>
          <textarea id="recommendations" placeholder="التدابير الوقائية أو التصحيحية المقترحة"></textarea>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>الاعتماد</h2>
      <div class="grid">
        <div class="field">
          <label>أُعد بواسطة</label>
          <input type="text" id="preparedBy">
        </div>
        <div class="field">
          <label>روجع / اعتمد بواسطة</label>
          <input type="text" id="approvedBy">
        </div>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn-secondary" id="resetBtn">مسح النموذج</button>
      <button type="button" class="btn-accent" id="saveBtn">حفظ في النظام</button>
      <button type="submit" class="btn-primary" id="generateBtn">إنشاء مستند Word</button>
    </div>
    <div class="status" id="status"></div>
  </form>
</div></main>

<footer><div class="container">
  <div>الإصدار <span class="ver" dir="ltr">v<?= version ?></span></div>
  <div style="display:flex;align-items:center;gap:10px;">
    <span>مركز العمليات التقنية <b dir="ltr">ITOC</b> — ICTD — جامعة سليمان الراجحي © 2026</span>
    <img class="itoc" data-logo="itoc" alt="ITOC">
  </div>
</div></footer>

<?!= include('Logos') ?>
<script>
[].forEach.call(document.querySelectorAll("img[data-logo]"), function (img) {
  img.src = ITOC_LOGOS[img.getAttribute("data-logo")] || "";
});

const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType,
        AlignmentType, ShadingType, BorderStyle, Header, Footer, PageNumber,
        VerticalAlign, TableBorders, HeightRule } = docx;

const FONT = "Arial";
const PURPLE = "501E8C";
const PURPLE_DARK = "3A1464";
const PURPLE_LIGHT = "F0EBF8";
const BLUE = "0A6EAA";
const BLUE_LIGHT = "E6F3FA";
const INK = "241436";
const MUTED = "6B5A80";
const BORDER = "D9CFEC";

const SEV_COLORS = {
  "حرجة": { fill: "FBE1E1", ink: "8A1F1F" },
  "عالية": { fill: "FCEBD8", ink: "8A4B10" },
  "متوسطة": { fill: "F0EBF8", ink: PURPLE_DARK },
  "منخفضة": { fill: "E4F3E8", ink: "1F6B37" }
};

const FIELD_IDS = [
  "title", "incidentId", "department", "incidentDate", "incidentTime", "location",
  "reporterName", "reporterTitle", "reporterContact", "reportDate",
  "description", "actionsTaken", "rootCause", "impact", "recommendations",
  "preparedBy", "approvedBy"
];

function val(id){ return document.getElementById(id).value.trim(); }
function setVal(id, v){ const el = document.getElementById(id); if (el) el.value = v || ""; }

function isArabicText(text){
  return /[ء-ي]/.test(String(text || ""));
}
function valueRun(value, opts){
  opts = opts || {};
  const text = value || "—";
  const arabic = isArabicText(text);
  return new TextRun(Object.assign({ text: text, size: 20, color: INK, font: FONT, rightToLeft: arabic }, opts));
}

const noBorders = {
  top: { style: BorderStyle.NONE, size: 0, color: "FFFFFF" },
  bottom: { style: BorderStyle.NONE, size: 0, color: "FFFFFF" },
  left: { style: BorderStyle.NONE, size: 0, color: "FFFFFF" },
  right: { style: BorderStyle.NONE, size: 0, color: "FFFFFF" },
};
const cellBorders = {
  top: { style: BorderStyle.SINGLE, size: 3, color: BORDER },
  bottom: { style: BorderStyle.SINGLE, size: 3, color: BORDER },
  left: { style: BorderStyle.SINGLE, size: 3, color: BORDER },
  right: { style: BorderStyle.SINGLE, size: 3, color: BORDER },
};

function fieldRow(label, value, opts){
  opts = opts || {};
  return new TableRow({
    cantSplit: true,
    children: [
      new TableCell({
        width: { size: 2600, type: WidthType.DXA }, shading: { fill: PURPLE_LIGHT, type: ShadingType.CLEAR },
        borders: cellBorders, verticalAlign: VerticalAlign.CENTER, margins: { top: 90, bottom: 90, left: 140, right: 140 },
        children: [ new Paragraph({ bidirectional: true, alignment: AlignmentType.RIGHT, children: [ new TextRun({ text: label, bold: true, size: 20, color: PURPLE_DARK, font: FONT, rightToLeft: true }) ] }) ]
      }),
      new TableCell({
        width: { size: 6400, type: WidthType.DXA }, shading: { fill: opts.fill || "FFFFFF", type: ShadingType.CLEAR },
        borders: cellBorders, verticalAlign: VerticalAlign.CENTER, margins: { top: 90, bottom: 90, left: 140, right: 140 },
        children: [ new Paragraph({ bidirectional: true, alignment: AlignmentType.RIGHT, children: [ valueRun(value, { color: opts.ink || INK, bold: !!opts.bold }) ] }) ]
      })
    ]
  });
}

function sectionHeading(text, num){
  return new Table({
    width: { size: 9000, type: WidthType.DXA }, borders: noBorders,
    rows: [ new TableRow({ children: [ new TableCell({
      width: { size: 9000, type: WidthType.DXA }, shading: { fill: PURPLE, type: ShadingType.CLEAR }, borders: noBorders,
      margins: { top: 80, bottom: 80, left: 160, right: 160 },
      children: [ new Paragraph({ bidirectional: true, alignment: AlignmentType.RIGHT, children: [
        new TextRun({ text: text, bold: true, size: 21, color: "FFFFFF", font: FONT, rightToLeft: true }),
        new TextRun({ text: "  " + num, bold: true, size: 18, color: BLUE_LIGHT, font: FONT, rightToLeft: true })
      ] }) ]
    }) ] }) ]
  });
}

function spacer(h){ return new Paragraph({ spacing: { after: h || 120 }, children: [] }); }

function bodyBox(text){
  const lines = (text || "").trim();
  const content = lines.length
    ? lines.split("\n").filter(l => l.length > 0).map(l => new Paragraph({ bidirectional: true, alignment: AlignmentType.RIGHT, spacing: { after: 90 }, children: [ valueRun(l) ] }))
    : [ new Paragraph({ bidirectional: true, alignment: AlignmentType.RIGHT, children: [ new TextRun({ text: "لم يتم إدخال بيانات لهذا القسم.", italics: true, size: 20, color: MUTED, font: FONT, rightToLeft: true }) ] }) ];
  return new Table({
    width: { size: 9000, type: WidthType.DXA },
    rows: [ new TableRow({ children: [ new TableCell({
      width: { size: 9000, type: WidthType.DXA }, shading: { fill: "FBFAFD", type: ShadingType.CLEAR }, borders: cellBorders,
      margins: { top: 140, bottom: 140, left: 180, right: 180 }, children: content
    }) ] }) ]
  });
}

function titleBlockRow(label, value){
  return new TableRow({ children: [
    new TableCell({
      width: { size: 3000, type: WidthType.DXA }, borders: noBorders, verticalAlign: VerticalAlign.CENTER,
      children: [ new Paragraph({ bidirectional: true, alignment: AlignmentType.RIGHT, children: [ new TextRun({ text: label, size: 18, color: BLUE_LIGHT, font: FONT, rightToLeft: true }) ] }) ]
    }),
    new TableCell({
      width: { size: 6000, type: WidthType.DXA }, borders: noBorders, verticalAlign: VerticalAlign.CENTER,
      children: [ new Paragraph({ bidirectional: true, alignment: AlignmentType.RIGHT, children: [ valueRun(value, { bold: true, color: "FFFFFF" }) ] }) ]
    })
  ]});
}

async function buildDocx(data){
  const sevColor = SEV_COLORS[data.severity] || SEV_COLORS["متوسطة"];
  const genDate = new Date().toLocaleDateString("ar-EG-u-ca-gregory");

  const doc = new Document({
    sections: [{
      properties: { page: { size: { width: 11906, height: 16838 }, margin: { top: 900, bottom: 900, left: 1000, right: 1000 } } },
      headers: { default: new Header({ children: [
        new Table({ width: { size: 9000, type: WidthType.DXA }, borders: noBorders, rows: [ new TableRow({ children: [
          new TableCell({ width: { size: 6300, type: WidthType.DXA }, borders: noBorders, verticalAlign: VerticalAlign.CENTER, children: [
            new Paragraph({ bidirectional: true, alignment: AlignmentType.RIGHT, children: [ new TextRun({ text: "جامعة سليمان الراجحي", bold: true, size: 18, color: PURPLE_DARK, font: FONT, rightToLeft: true }) ] }),
            new Paragraph({ bidirectional: true, alignment: AlignmentType.RIGHT, children: [ new TextRun({ text: "الإدارة التنفيذية للاتصالات وتقنية المعلومات", size: 15, color: MUTED, font: FONT, rightToLeft: true }) ] })
          ] }),
          new TableCell({ width: { size: 2700, type: WidthType.DXA }, borders: noBorders, verticalAlign: VerticalAlign.CENTER,
            children: [ new Paragraph({ alignment: AlignmentType.LEFT, children: [ new TextRun({ text: "ICTD", bold: true, size: 20, color: BLUE, font: FONT }) ] }) ] })
        ] }) ] }),
        new Paragraph({ border: { bottom: { color: PURPLE, space: 4, style: BorderStyle.SINGLE, size: 8 } }, spacing: { after: 0 }, children: [] })
      ] }) },
      footers: { default: new Footer({ children: [
        new Paragraph({ border: { top: { color: BORDER, space: 4, style: BorderStyle.SINGLE, size: 4 } }, spacing: { after: 60 }, children: [] }),
        new Table({ width: { size: 9000, type: WidthType.DXA }, borders: noBorders, rows: [ new TableRow({ children: [
          new TableCell({ width: { size: 4500, type: WidthType.DXA }, borders: noBorders,
            children: [ new Paragraph({ bidirectional: true, alignment: AlignmentType.RIGHT, children: [ new TextRun({ text: "مستند داخلي — سري", size: 14, color: MUTED, font: FONT, rightToLeft: true }) ] }) ] }),
          new TableCell({ width: { size: 4500, type: WidthType.DXA }, borders: noBorders, children: [ new Paragraph({ alignment: AlignmentType.LEFT, children: [
            new TextRun({ text: "صفحة ", size: 14, color: MUTED, font: FONT }),
            new TextRun({ children: [PageNumber.CURRENT], size: 14, color: MUTED, font: FONT }),
            new TextRun({ text: " من ", size: 14, color: MUTED, font: FONT }),
            new TextRun({ children: [PageNumber.TOTAL_PAGES], size: 14, color: MUTED, font: FONT }),
          ] }) ] })
        ] }) ] })
      ] }) },
      children: [
        new Table({ width: { size: 9000, type: WidthType.DXA }, borders: noBorders, rows: [ new TableRow({ children: [ new TableCell({
          width: { size: 9000, type: WidthType.DXA }, shading: { fill: PURPLE_DARK, type: ShadingType.CLEAR }, borders: noBorders,
          margins: { top: 260, bottom: 220, left: 260, right: 260 }, children: [
            new Paragraph({ bidirectional: true, alignment: AlignmentType.RIGHT, spacing: { after: 40 }, children: [ new TextRun({ text: "تقرير حادثة تقنية معلومات", bold: true, size: 36, color: "FFFFFF", font: FONT, rightToLeft: true }) ] }),
            new Paragraph({ bidirectional: true, alignment: AlignmentType.RIGHT, spacing: { after: 200 }, children: [ new TextRun({ text: data.title || "حادثة بدون عنوان", size: 22, color: BLUE_LIGHT, italics: true, font: FONT, rightToLeft: isArabicText(data.title) }) ] }),
            new Table({ width: { size: 8500, type: WidthType.DXA }, borders: noBorders, rows: [
              titleBlockRow("رقم الحادثة:", data.incidentId || "—"),
              titleBlockRow("تاريخ إنشاء التقرير:", genDate)
            ] })
          ]
        }) ] }) ]}),
        spacer(60),
        new Table({ width: { size: 9000, type: WidthType.DXA }, borders: noBorders, rows: [ new TableRow({ children: [ new TableCell({
          width: { size: 9000, type: WidthType.DXA }, shading: { fill: sevColor.fill, type: ShadingType.CLEAR }, borders: cellBorders,
          margins: { top: 100, bottom: 100, left: 180, right: 180 }, children: [ new Paragraph({ bidirectional: true, alignment: AlignmentType.RIGHT, children: [
            new TextRun({ text: "مستوى الخطورة:  ", bold: true, size: 20, color: sevColor.ink, font: FONT, rightToLeft: true }),
            new TextRun({ text: data.severity || "—", bold: true, size: 22, color: sevColor.ink, font: FONT, rightToLeft: isArabicText(data.severity) })
          ] }) ]
        }) ] }) ]}),
        spacer(180),
        sectionHeading("بيانات الحادثة", "١"), spacer(60),
        new Table({ width: { size: 9000, type: WidthType.DXA }, rows: [
          fieldRow("الإدارة / القسم", data.department), fieldRow("تاريخ الحادثة", data.incidentDate),
          fieldRow("وقت الحادثة", data.incidentTime), fieldRow("الموقع / النظام المتأثر", data.location),
          fieldRow("التصنيف", data.category)
        ] }),
        spacer(220),
        sectionHeading("بيانات مقدّم البلاغ", "٢"), spacer(60),
        new Table({ width: { size: 9000, type: WidthType.DXA }, rows: [
          fieldRow("مقدّم البلاغ", data.reporterName), fieldRow("المسمى الوظيفي", data.reporterTitle),
          fieldRow("وسيلة التواصل", data.reporterContact), fieldRow("تاريخ التقرير", data.reportDate)
        ] }),
        spacer(220),
        sectionHeading("وصف الحادثة", "٣"), spacer(60), bodyBox(data.description), spacer(220),
        sectionHeading("الإجراءات الفورية المتخذة", "٤"), spacer(60), bodyBox(data.actionsTaken), spacer(220),
        sectionHeading("السبب الجذري", "٥"), spacer(60), bodyBox(data.rootCause), spacer(220),
        sectionHeading("تقييم الأثر", "٦"), spacer(60), bodyBox(data.impact), spacer(220),
        sectionHeading("التوصيات / الإجراءات التصحيحية", "٧"), spacer(60), bodyBox(data.recommendations), spacer(220),
        sectionHeading("الاعتماد", "٨"), spacer(60),
        new Table({ width: { size: 9000, type: WidthType.DXA }, rows: [
          fieldRow("أُعد بواسطة", data.preparedBy), fieldRow("روجع / اعتمد بواسطة", data.approvedBy)
        ] }),
      ]
    }]
  });

  return await Packer.toBlob(doc);
}

/* ------------------------- Data collection / fill ------------------------- */

function collectFormData(){
  return {
    title: val("title"),
    incidentId: val("incidentId"),
    department: val("department"),
    incidentDate: val("incidentDate"),
    incidentTime: val("incidentTime"),
    location: val("location"),
    category: document.getElementById("category").value,
    severity: (document.querySelector('input[name="severity"]:checked') || {}).value || "",
    reporterName: val("reporterName"),
    reporterTitle: val("reporterTitle"),
    reporterContact: val("reporterContact"),
    reportDate: val("reportDate"),
    description: val("description"),
    actionsTaken: val("actionsTaken"),
    rootCause: val("rootCause"),
    impact: val("impact"),
    recommendations: val("recommendations"),
    preparedBy: val("preparedBy"),
    approvedBy: val("approvedBy")
  };
}

function fillForm(data){
  if (!data) return;
  FIELD_IDS.forEach(id => setVal(id, data[id]));
  const catEl = document.getElementById("category");
  if (data.category) catEl.value = data.category;
  const sevInput = document.querySelector('input[name="severity"][value="' + (data.severity || "متوسطة") + '"]');
  if (sevInput) sevInput.checked = true;
}

function clearForm(){
  document.getElementById("incidentForm").reset();
  setVal("incidentId", "");
  document.getElementById("status").textContent = "";
}

/* ------------------------------ History dropdown ------------------------------ */

const reportSelect = document.getElementById("reportSelect");
const historyStatus = document.getElementById("historyStatus");

function refreshReportList(keepSelection){
  const prev = keepSelection ? reportSelect.value : "";
  historyStatus.textContent = "جارٍ التحميل...";
  google.script.run
    .withSuccessHandler(function (items) {
      reportSelect.innerHTML = '<option value="">— تقرير جديد —</option>';
      (items || []).forEach(function (r) {
        const opt = document.createElement("option");
        opt.value = r.id;
        opt.textContent = r.id + " — " + (r.title || "بدون عنوان") + " — " + (r.incidentDate || "") + " — " + (r.severity || "");
        reportSelect.appendChild(opt);
      });
      if (prev) reportSelect.value = prev;
      historyStatus.textContent = (items || []).length + " تقرير مسجّل";
    })
    .withFailureHandler(function (e) {
      historyStatus.textContent = "تعذّر تحميل القائمة: " + e.message;
    })
    .listReports();
}

reportSelect.addEventListener("change", function () {
  const id = reportSelect.value;
  if (!id) { clearForm(); return; }
  historyStatus.textContent = "جارٍ تحميل التقرير...";
  google.script.run
    .withSuccessHandler(function (data) {
      if (!data) { historyStatus.textContent = "تعذّر العثور على التقرير."; return; }
      fillForm(data);
      historyStatus.textContent = "تم تحميل التقرير " + id;
    })
    .withFailureHandler(function (e) {
      historyStatus.textContent = "خطأ: " + e.message;
    })
    .getReport(id);
});

document.getElementById("newReportBtn").addEventListener("click", function () {
  reportSelect.value = "";
  clearForm();
  historyStatus.textContent = "";
});

refreshReportList(false);

/* ------------------------------ Save / Generate ------------------------------ */

document.getElementById("resetBtn").addEventListener("click", clearForm);

document.getElementById("saveBtn").addEventListener("click", function () {
  const status = document.getElementById("status");
  const data = collectFormData();
  if (!data.title || !data.department || !data.incidentDate || !data.reporterName || !data.description){
    status.className = "status err";
    status.textContent = "يرجى تعبئة جميع الحقول الإلزامية (المشار إليها بـ *) قبل الحفظ.";
    return;
  }
  const btn = document.getElementById("saveBtn");
  btn.disabled = true;
  status.className = "status info";
  status.textContent = "جارٍ الحفظ...";
  google.script.run
    .withSuccessHandler(function (result) {
      btn.disabled = false;
      setVal("incidentId", result.id);
      status.className = "status ok";
      status.textContent = "تم الحفظ في النظام برقم " + result.id + ".";
      refreshReportList(true);
      reportSelect.value = result.id;
    })
    .withFailureHandler(function (e) {
      btn.disabled = false;
      status.className = "status err";
      status.textContent = "تعذّر الحفظ: " + e.message;
    })
    .saveReport(data);
});

document.getElementById("incidentForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const status = document.getElementById("status");
  status.className = "status";
  status.textContent = "";

  const data = collectFormData();
  if (!data.title || !data.department || !data.incidentDate || !data.reporterName || !data.description){
    status.className = "status err";
    status.textContent = "يرجى تعبئة جميع الحقول الإلزامية (المشار إليها بـ *).";
    return;
  }
  if (typeof docx === "undefined"){
    status.className = "status err";
    status.textContent = "تعذّر تحميل محرك إنشاء المستندات. يرجى التحقق من اتصال الإنترنت وإعادة تحميل الصفحة.";
    return;
  }
  try{
    status.textContent = "جارٍ إنشاء المستند...";
    const blob = await buildDocx(data);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const safeTitle = (data.title || "تقرير_حادثة").replace(/[\\/:*?"<>|]+/g, "_").slice(0, 60);
    a.href = url;
    a.download = `تقرير_حادثة_${safeTitle || "بدون_عنوان"}.docx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    status.className = "status ok";
    status.textContent = "تم إنشاء المستند وتنزيله بنجاح.";
  }catch(err){
    console.error(err);
    status.className = "status err";
    status.textContent = "حدث خطأ أثناء إنشاء المستند. يرجى المحاولة مرة أخرى.";
  }
});
</script>
</body>
</html>
